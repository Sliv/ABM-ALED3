<header>
  <div class="logo">
    <img src="assets/logo.png" alt="Logo" />
  </div>

  <nav class="nav-inline">
    <ul>
      <li><a routerLink="">Home</a></li>
      <li><a routerLink="comprar-productos">Comprar</a></li>

      <ng-container *ngIf="isLoggedIn">
        <li><a routerLink="mis-compras">Mis compras</a></li>
        <li><a routerLink="mi-carrito">Carrito</a></li>
        <li *ngIf="rol === 'administrador'">
          <a routerLink="listar-producto">Admin Productos</a>
        </li>
        <li><a (click)="logout()" style="cursor: pointer;">Cerrar sesión</a></li>
      </ng-container>

      <ng-container *ngIf="!isLoggedIn">
        <li><a routerLink="login">Iniciar sesión</a></li>
        <li><a routerLink="sign-up">Registrarse</a></li>
      </ng-container>
    </ul>
  </nav>

  <button class="menu-toggle" (click)="toggleMenu()">☰</button>
</header>



<nav class="nav-side" [class.open]="menuVisible">
  <ul>
    <li><a routerLink="">Home</a></li>
    <li><a routerLink="listaUsuario">Categorías</a></li>
    <li><a routerLink="comprar-productos">Comprar</a></li>

    <ng-container *ngIf="isLoggedIn">
      <li><a routerLink="mis-compras">Mis compras</a></li>
      <li *ngIf="rol === 'administrador'">
        <a routerLink="producto">Crear producto</a>
      </li>
      <li><a (click)="logout()" style="cursor: pointer;">Cerrar sesión</a></li>
    </ng-container>

    <ng-container *ngIf="!isLoggedIn">
      <li><a routerLink="login">Iniciar sesión</a></li>
      <li><a routerLink="sign-up">Registrarse</a></li>
    </ng-container>
  </ul>
</nav>
