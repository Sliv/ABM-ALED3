<div class="login-wrapper">
  <div class="login-card">
    <div class="left-panel">
      <h2>Welcome!</h2>
      <p>Create your account.<br />For Free!</p>
      <button class="signup-btn">Sign Up</button>
    </div>
    <div class="right-panel">
      <h3>Login</h3>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label for="username">Username/Email address<span class="required">*</span></label>
        <input type="text" id="username" formControlName="username" placeholder="Username or Email" />

        <label for="password">Password<span class="required">*</span></label>
        <input type="password" id="password" formControlName="password" placeholder="Password" />
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <button type="submit" [disabled]="loginForm.invalid" class="signin-btn">Sign In</button>
        <a class="forgot-link" href="#">Forgot password?</a>
      </form>
    </div>
  </div>
</div>
