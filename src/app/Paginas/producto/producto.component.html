<div *ngIf="producto" class="producto-detalle">
  <img [src]="producto.imagen" alt="{{ producto.nombre }}" class="producto-img" />

  <div class="producto-info">
    <h1>{{ producto.nombre }}</h1>
    <p class="descripcion">{{ producto.descripcion }}</p>
    <p class="precio">$ {{ producto.precio }}</p>

    <label for="cantidad">Cantidad:</label>
    <input type="number" [(ngModel)]="cantidad" min="1" id="cantidad" />

    <div class="acciones">
      <button class="btn-carrito" (click)="agregarAlCarrito()">Agregar al carrito</button>
      <app-alerts
        [mensaje]="mensajeAlerta"
        [tipo]="tipoAlerta"
        [visible]="mostrarAlerta"
        [duracion]="20000"
        (cerrado)="mostrarAlerta = false">
      </app-alerts>
      <button class="btn-comprar" (click)="comprarAhora()">Comprar ahora</button>
    </div>
  </div>
</div>

<section class="pr-section">
  <h2>Preguntas y respuestas</h2>

  <div class="pr-input">
    <input type="text" placeholder="Escribí una pregunta..." [(ngModel)]="preguntaTexto" #inputPregunta />
    <button class="btn-send" (click)="enviarPregunta()">></button>
  </div>

  <div *ngFor="let mensaje of (mostrarTodos ? mensajes : mensajes.slice(0,5)); trackBy: trackById" class="pr-item">
    <p class="preguntas"><strong>{{ mensaje.username }}:</strong> {{ mensaje.texto }}</p>
  </div>

  <div *ngIf="mensajes.length > 5">
    <button class="btn-ver-mas" (click)="toggleMostrarTodos()">
      {{ mostrarTodos ? 'Ver menos' : 'Ver más' }}
    </button>
  </div>
</section>
