<div class="historial-container">
  <h2><span class="icon">🛒</span> Mis Compras</h2>

  <div *ngIf="compras.length === 0" class="mensaje-vacio">
    No hay compras registradas.
  </div>

  <div *ngIf="compras.length > 0">
    <div class="compra-card" *ngFor="let compra of compras">
      <div class="compra-header">
        <span class="fecha">🗓️ {{ compra.fecha | date: 'dd/MM/yyyy HH:mm:ss' }}</span>
      </div>
      <ul class="productos-lista">
        <li *ngFor="let item of compra.productos">
          <span class="producto-nombre">📦 {{ item.producto.nombre }}</span>
          <span class="producto-detalle">
            (x{{ item.cantidad }}) - ${{ item.producto.precio * item.cantidad | number: '1.2-2' }}
          </span>
        </li>
      </ul>
    </div>
  </div>
</div>
