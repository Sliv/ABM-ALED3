<main class="home-container">

  <section class="hero">
    <app-carousel
      tipo="imagen"
      [imagenes]="[
        { 
          src: 'https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?w=1600',
          link: 'https://unsplash.com/photos/1',
          titulo: 'Creative Workspace',
          subtitulo: 'Design • Inspiration • Ideas',
          posicion: 'bottom-left'
        },
        { 
          src: 'https://images.unsplash.com/photo-1506765515384-028b60a970df?w=1600',
          link: 'https://unsplash.com/photos/2',
          titulo: 'Adventure Awaits',
          subtitulo: 'Explore Nature',
          posicion: 'center'
        },
        { 
          src: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600',
          link: 'https://unsplash.com/photos/3',
          titulo: 'Modern Development',
          subtitulo: 'Coding the future',
          posicion: 'top-right'
        }
      ]"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="5000"
      height="900px"
      width="100%">
    </app-carousel>
  </section>

  <section class="section">
    <h2 class="section-title">Popular Plants</h2>

    <app-carousel
      tipo="card"
      [items]="[
        { image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600', title: 'Canna', subtitle: 'Indoor plant', price: 27300, cuotas: '3 cuotas sin interés', link: '/detalle/1' },
        { image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600', title: 'Jade', subtitle: 'Succulent', price: 19990, cuotas: '3 cuotas sin interés', link: '/detalle/2' },
        { image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600', title: 'Zebra', subtitle: 'Small cactus', price: 12500, cuotas: '3 cuotas sin interés', link: '/detalle/3' },
        { image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600', title: 'Snake Plant', subtitle: 'Air purifier', price: 21900, cuotas: '3 cuotas sin interés', link: '/detalle/4' },
        { image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600', title: 'Peace Lily', subtitle: 'Elegant leaves', price: 28990, cuotas: '3 cuotas sin interés', link: '/detalle/5' }
      ]"
      [visibleCount]="3"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="4000">
    </app-carousel>
  </section>

  <section class="section">
    <app-carousel
      tipo="imagen"
      [imagenes]="[
        {
          src: 'assets/banners/plant1.jpg',
          titulo: 'Nature in your home',
          subtitulo: 'The best indoor plants',
          posicion: 'center'
        },
        {
          src: 'assets/banners/plant2.jpg',
          titulo: 'Premium Quality',
          subtitulo: 'Hand-picked green life',
          posicion: 'bottom-right'
        }
      ]"
      height="520px"
      [autoplay]="true">
    </app-carousel>
  </section>


  <section class="section">
    <h2 class="section-title">Recommended For You</h2>

    <app-carousel
      tipo="card"
      [items]="[
        { image: 'assets/plant1.jpg', title: 'Canna', subtitle: 'Indoor plant', link: '/detalle/1' },
        { image: 'assets/plant2.jpg', title: 'Jade', subtitle: 'Succulent', link: '/detalle/2' },
        { image: 'assets/plant3.jpg', title: 'Zebra', subtitle: 'Small cactus', link: '/detalle/3' },
        { image: 'assets/plant4.jpg', title: 'Snake', subtitle: 'Air purifier', link: '/detalle/4' },
        { image: 'assets/plant5.jpg', title: 'Peace Lily', subtitle: 'Elegant leaves', link: '/detalle/5' },
        { image: 'assets/plant6.jpg', title: 'Fern', subtitle: 'Shady plant', link: '/detalle/6' }
      ]"
      [visibleCount]="3"
      [cardWidth]="'380px'"
      [cardHeight]="'650px'"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="4000">
    </app-carousel>
  </section>

  <app-newsletter></app-newsletter>

  <section class="section">
    <app-faqs [faqs]="faqData"></app-faqs>
  </section>

  <app-footer></app-footer>

</main>
