<main class="home-container"> 

  <section class="hero">
    <app-carousel
      tipo="imagen"
      [imagenes]="[
        { 
          src: 'assets/Impresora.jpg',
          link: '/producto/1',
          titulo: 'Equipá tu espacio',
          subtitulo: 'Tecnología y accesorios para tu día a día',
          posicion: 'bottom-left'
        },
        { 
          src: 'assets/Zapatilla.jpg',
          link: '/producto/1',
          titulo: 'Comodidad que se mueve con vos',
          subtitulo: 'Calzado urbano y deportivo',
          posicion: 'center'
        },
        { 
          src: 'assets/Remera.jpg',
          link: '/producto/1',
          titulo: 'Estilo para todos los días',
          subtitulo: 'Moda actual al mejor precio',
          posicion: 'top-right'
        }
      ]"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="5000"
      height="800px"
      width="100%">
    </app-carousel>
  </section>

  <section class="section-card">
    <h2 class="section-title">Productos más populares</h2>
    <app-carousel
      tipo="card"
      [items]="[
        { image: 'assets/Batidora.jpg', title: 'Batidora eléctrica', subtitle: 'Potencia y practicidad en tu cocina', price: 27300, cuotas: '3 cuotas sin interés', link: '/producto/1' },
        { image: 'assets/Tablet.png', title: 'Tablet multimedia', subtitle: 'Trabajo y entretenimiento en un solo lugar', price: 19990, cuotas: '12 cuotas sin interés', link: '/producto/1' },
        { image: 'assets/ZapatillasPuma.jfif', title: 'Zapatillas deportivas', subtitle: 'Diseño y confort para cada paso', price: 12500, cuotas: '6 cuotas sin interés', link: '/producto/1' },
        { image: 'assets/ZapatillasVans.jfif', title: 'Zapatillas urbanas', subtitle: 'Estilo casual para todos los días', price: 21900, cuotas: '3 cuotas sin interés', link: '/producto/1' },
        { image: 'assets/Monitor.webp', title: 'Monitor Full HD', subtitle: 'Más productividad y mejor imagen', price: 28990, cuotas: '6 cuotas sin interés', link: '/producto/1' }
      ]"
      [visibleCount]="3"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="4000">
    </app-carousel>
  </section>

  <section class="section-banner">
    <h2 class="section-title">Productos en oferta</h2>
    <app-carousel
      tipo="imagen"
      [imagenes]="[
        {
          src: 'assets/Router.jpg',
          titulo: 'Conectividad sin límites',
          subtitulo: 'Internet rápido y estable para tu hogar',
          posicion: 'center',
          link: '/producto/1'
        },
        {
          src: 'assets/Notebook.jpg',
          titulo: 'Potencia para trabajar y estudiar',
          subtitulo: 'Notebooks al mejor precio',
          posicion: 'bottom-right',
          link: '/producto/1'
        }
      ]"
      height="900px"
      [autoplay]="true">
    </app-carousel>
  </section>

  <section class="section">
    <h2 class="section-title">Tal vez te interese</h2>
    <app-carousel
      tipo="card"
      [items]="[
        { image: 'assets/Batidora.jpg', title: 'Batidora compacta', subtitle: 'Ideal para el uso diario', link: '/producto/1' },
        { image: 'assets/Tablet.png', title: 'Tablet liviana', subtitle: 'Perfecta para llevar a todos lados', link: '/producto/1' },
        { image: 'assets/Router.jpg', title: 'Router Wi-Fi', subtitle: 'Cobertura en toda tu casa', link: '/producto/1' },
        { image: 'assets/Monitor.webp', title: 'Monitor LED', subtitle: 'Calidad de imagen superior', link: '/producto/1' },
        { image: 'assets/Notebook.jpg', title: 'Notebook portátil', subtitle: 'Rendimiento y diseño', link: '/producto/1' },
        { image: 'assets/Sommier.jpg', title: 'Sommier premium', subtitle: 'Descanso y confort garantizado', link: '/producto/1' }
      ]"
      [visibleCount]="3"
      [cardWidth]="'400px'"
      [cardHeight]="'650px'"
      [mostrarFlechas]="true"
      [autoplay]="true"
      [intervalo]="4000">
    </app-carousel>
  </section>

  <app-newsletter></app-newsletter>

  <section class="section">
    <app-faqs [faqs]="faqData"></app-faqs>
  </section>

  <app-footer></app-footer>

</main>
