<div class="reporteria-wrapper" *ngIf="esAdmin; else noAcceso">  
  <h2>Reportería de Ventas</h2>

  <div class="filters">
    <div class="filter-item">
      <label for="agrupacion">Agrupar por:</label>
      <select id="agrupacion" [(ngModel)]="agrupacion" (change)="actualizarGrafico()">
        <option value="semana">Semana actual</option>
        <option value="mes">Mes</option>
        <option value="anio">Año</option>
      </select>
    </div>

    <div class="filter-item" *ngIf="agrupacion === 'mes'">
      <label for="meses">Seleccionar mes:</label>
      <select id="meses" [(ngModel)]="mesesSeleccionados[0]" (change)="actualizarGrafico()">
        <option *ngFor="let mes of mesesDisponibles" [value]="mes.value">
          {{ mes.label }}
        </option>
      </select>
    </div>

    <div class="filter-item" *ngIf="agrupacion === 'anio'">
      <label for="anio">Seleccionar año:</label>
      <select id="anio" [(ngModel)]="anioSeleccionado" (change)="actualizarGrafico()">
        <option *ngFor="let anio of aniosDisponibles" [value]="anio">{{ anio }}</option>
      </select>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart-card">
      <h3>Ventas</h3>
      <canvas id="ventasChart"></canvas>
    </div>

    <div class="chart-card">
      <h3>Productos más vendidos</h3>
      <table class="tabla-productos">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad vendida</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of productosVendidos">
            <td>{{ p.nombre }}</td>
            <td>{{ p.cantidad }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="export-section">
    <button class="btn-export" (click)="exportarCSV()">Exportar CSV</button>
  </div>
</div>

<ng-template #noAcceso>
  <p>No tienes permisos para ver esta sección.</p>
</ng-template>
